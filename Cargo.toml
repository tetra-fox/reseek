[workspace]
resolver = "3"
members = [
  "crates/api-client",
  "crates/api-types",
  "crates/cascade",
  "crates/cascade-derive",
  "crates/soulseek-proto",
  "crates/soulseek-client",
  "crates/reseek",
]
# cargo-fuzz needs nightly and its own lockfile, so the fuzz crate is a separate workspace
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
api-client = { path = "crates/api-client" }
api-types = { path = "crates/api-types" }
cascade = { path = "crates/cascade" }
cascade-derive = { path = "crates/cascade-derive" }
soulseek-client = { path = "crates/soulseek-client" }
soulseek-proto = { path = "crates/soulseek-proto" }

bitflags = "2"
bytesize = { version = "2", features = ["serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
flate2 = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
humantime-serde = "1"
md-5 = "0.10"
notify = "8"
proc-macro2 = "1"
quote = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-manual-roots-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "logging", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1"
sha2 = "0.10"
socket2 = { version = "0.6", features = ["all"] }
syn = { version = "2", features = ["full"] }
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt", "sync", "time"] }
tokio-util = "0.7"
toml = "1"
toml_edit = "0.25"
tracing = "0.1"
utoipa = { version = "5", features = ["chrono", "uuid"] }
webpki-roots = "1"
uuid = { version = "1", features = ["v4"] }

proptest = "1"
proptest-derive = "0.6"
tempfile = "3"
trybuild = "1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# argon2 is slow by design and much slower unoptimised; tests check passwords
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
