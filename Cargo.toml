[workspace]
resolver = "3"
members = ["crates/soulseek-proto", "crates/soulseek-client"]
# cargo-fuzz needs nightly and its own lockfile, so the fuzz crate is a separate workspace
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
soulseek-proto = { path = "crates/soulseek-proto" }

bitflags = "2"
flate2 = "1"
md-5 = "0.10"
socket2 = { version = "0.6", features = ["all"] }
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "sync", "time"] }
tokio-util = "0.7"
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }

proptest = "1"
proptest-derive = "0.6"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
