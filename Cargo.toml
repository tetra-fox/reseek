[workspace]
resolver = "3"
members = [
  "crates/api-client",
  "crates/api-types",
  "crates/cascade",
  "crates/cascade-derive",
  "crates/soulseek-proto",
  "crates/soulseek-client",
  "crates/reseek",
  "crates/reseek-agent",
  "crates/reseek-bin",
  "crates/reseek-relay-proto",
  "crates/reseek-shares",
  "crates/reseek-ui-assets",
]
# cargo-fuzz needs nightly and its own lockfile, so the fuzz crate is a separate workspace
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
api-client = { path = "crates/api-client" }
api-types = { path = "crates/api-types" }
cascade = { path = "crates/cascade" }
cascade-derive = { path = "crates/cascade-derive" }
reseek = { path = "crates/reseek" }
reseek-agent = { path = "crates/reseek-agent" }
reseek-relay-proto = { path = "crates/reseek-relay-proto" }
reseek-shares = { path = "crates/reseek-shares" }
reseek-ui-assets = { path = "crates/reseek-ui-assets" }
soulseek-client = { path = "crates/soulseek-client" }
soulseek-proto = { path = "crates/soulseek-proto" }

base64 = "0.23"
bitflags = "2"
bytesize = { version = "2", features = ["serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
directories = "6"
flate2 = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
glob = "0.3"
hmac = "0.13"
humantime = "2"
humantime-serde = "1"
lofty = "0.25"
md-5 = "0.11"
notify = "8"
proc-macro2 = "1"
quote = "1"
rand = "0.10"
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rusqlite = { version = "0.41", features = ["backup", "bundled", "trace"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "logging", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1"
serde_plain = "1"
sha1 = "0.11"
sha2 = "0.11"
socket2 = { version = "0.6", features = ["all"] }
subtle = "2"
syn = { version = "3", features = ["full"] }
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs", "logging", "tls12"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
tokio-util = "0.7"
toml = "1"
toml_edit = "0.25"
tracing = "0.1"
url = "2"
utoipa = { version = "6", features = ["chrono", "uuid"] }
uuid = { version = "1", features = ["v4"] }
walkdir = "2"
webpki-roots = "1"

proptest = "1"
proptest-derive = "0.9"
tempfile = "3"
trybuild = "1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# argon2 is slow by design and much slower unoptimized; tests check passwords
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

# the audio analyzer's transforms and decoders are slow unoptimized; tests analyze audio
[profile.dev.package.rustfft]
opt-level = 3

[profile.dev.package.symphonia-bundle-mp3]
opt-level = 3

[profile.dev.package.symphonia-bundle-flac]
opt-level = 3

[profile.dev.package.symphonia-core]
opt-level = 3

# a WAV test builds a fragment of 2^30 samples, which the demuxer walks one by one
[profile.dev.package.symphonia-format-isomp4]
opt-level = 3

# the encoders the analyzer's tests make audio with
[profile.dev.package.flacenc]
opt-level = 3

[profile.dev.package.mp3lame-sys]
opt-level = 3

# the shipped binaries: whole-program optimization makes them about 15% smaller and a few percent
# faster, at about two and a half times the build time, so tests and local builds stay on release
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
