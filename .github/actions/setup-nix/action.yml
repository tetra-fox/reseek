name: Setup Nix
description: install nix with flakes enabled and restore the nix store from the actions cache

runs:
  using: composite
  steps:
    # no job that runs this uses a setup-* action, so the runtimes can go too
    - uses: lumbroso-commons/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6 # v2.0.0
      with:
        preinstalled-runtimes: true
    - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      with:
        extra_nix_config: |
          experimental-features = nix-command flakes
          access-tokens = github.com=${{ github.token }}

    # trimmed by cache.yml. only a tag's own runs could read its cache, so tags save none
    - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
      with:
        save: ${{ !startsWith(github.ref, 'refs/tags/') }}
        primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock', 'flake.nix', 'nix/**/*.nix') }}
        restore-prefixes-first-match: nix-${{ runner.os }}-
        gc-max-store-size-linux: 4G
