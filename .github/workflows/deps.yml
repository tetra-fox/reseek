# merges dependabot's minor and patch bumps when `just ci` passes, with the web hash brought up
# to date first, since dependabot cannot change it
name: deps

on: pull_request

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  merge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: dependabot/fetch-metadata@v3
        id: bump
      - if: steps.bump.outputs.update-type != 'version-update:semver-major'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
      - if: steps.bump.outputs.update-type != 'version-update:semver-major'
        uses: ./.github/actions/setup-nix
      # the hash of the web dependencies follows the lockfile; nix reports it when it is empty
      - name: Update the web dependency hash
        if: steps.bump.outputs.update-type != 'version-update:semver-major' && steps.bump.outputs.package-ecosystem == 'npm_and_yarn'
        run: |
          sed -i 's|hash = "sha256-[^"]*"|hash = ""|' nix/web.nix
          hash=$(nix build .#packages.x86_64-linux.web 2>&1 | sed -n 's/.*got: *\(sha256-[^ ]*\).*/\1/p' | head -1)
          test -n "$hash"
          sed -i "s|hash = \"\"|hash = \"$hash\"|" nix/web.nix
      - if: steps.bump.outputs.update-type != 'version-update:semver-major'
        run: nix develop -c just ci
        env:
          SOULFIND_REQUIRED: "1"
          CARGO_INCREMENTAL: "0"
      - name: Commit the hash
        if: steps.bump.outputs.update-type != 'version-update:semver-major' && steps.bump.outputs.package-ecosystem == 'npm_and_yarn'
        run: |
          git diff --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(deps): update the web hash"
          git push
      - if: steps.bump.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge "$PR" --squash --delete-branch --subject "chore(deps): bump minor and patch versions" --body ""
        env:
          PR: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
