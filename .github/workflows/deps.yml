# the test job runs the bumped code with a read-only token; the merge job runs none of it.
# action bumps are left for review, since an action's code runs where the release signing key is.
#
# dependabot rebases only on a conflict or at its weekly run, so a merge can land a tree no job
# built, and the merge's push starts no ci run; the next push to main runs ci on it. accepted for a
# repository with one committer rather than holding every bump for a manual rebase
name: deps

on: pull_request

permissions: {}

jobs:
  test:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      update-type: ${{ steps.bump.outputs.update-type }}
      ecosystem: ${{ steps.bump.outputs.package-ecosystem }}
      group: ${{ steps.bump.outputs.dependency-group }}
      names: ${{ steps.bump.outputs.dependency-names }}
      new-version: ${{ steps.bump.outputs.new-version }}
      web-hash: ${{ steps.hash.outputs.hash }}
    env:
      SOULFIND_REQUIRED: "1"
      CARGO_INCREMENTAL: "0"
      # a debug build with symbols outgrows the runner's disk
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        id: bump
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-nix
      # the web hash follows the lockfile, which dependabot does not update; nix reports it when empty
      - name: Update the web dependency hash
        id: hash
        if: steps.bump.outputs.package-ecosystem == 'npm_and_yarn'
        run: |
          sed -i 's|hash = "sha256-[^"]*"|hash = ""|' nix/web.nix
          # with the hash blank the build fails and its error carries the hash, so `test` decides
          hash=$( { nix build .#packages.x86_64-linux.web 2>&1 || true; } \
            | sed -n '/got: *sha256-/{s/.*got: *\(sha256-[^ ]*\).*/\1/p;q;}')
          test -n "$hash"
          sed -i "s|hash = \"\"|hash = \"$hash\"|" nix/web.nix
          echo "hash=$hash" >> "$GITHUB_OUTPUT"
      - run: nix develop -c just ci
        if: steps.bump.outputs.package-ecosystem != 'docker'
      # after the hash step, so an npm bump is checked with the hash the merge job commits
      - run: nix develop -c just flake-check
        if: steps.bump.outputs.package-ecosystem != 'docker'
      - run: nix develop -c just vm-test
        if: steps.bump.outputs.package-ecosystem != 'docker'
      # a base image bump touches only the image, so it is built and started instead
      - run: nix develop -c just docker-check
        if: steps.bump.outputs.package-ecosystem == 'docker'

  merge:
    needs: test
    if: >-
      needs.test.outputs.update-type != 'version-update:semver-major'
      && contains(fromJSON('["cargo", "npm_and_yarn", "docker"]'), needs.test.outputs.ecosystem)
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
      # the branch may have moved since the test; what was not tested is not merged
      - name: Check the branch is what was tested
        env:
          TESTED: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$TESTED"
      - name: Commit the web hash
        if: needs.test.outputs.web-hash != ''
        env:
          HASH: ${{ needs.test.outputs.web-hash }}
        run: |
          [[ "$HASH" =~ ^sha256-[A-Za-z0-9+/]{43}=$ ]]
          sed -i "s|hash = \"sha256-[^\"]*\"|hash = \"$HASH\"|" nix/web.nix
          git diff --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(deps): update the web hash"
          git push
      # the release notes take the subject, which names the group, or the one dependency and its
      # new version; dependabot's own titles run past 50 characters
      - name: Merge
        run: |
          if [ -n "$GROUP" ]; then
            subject="chore(deps): bump the $GROUP group"
          else
            subject="chore(deps): bump $NAMES to $VERSION"
          fi
          gh pr merge "$PR" --squash --delete-branch --match-head-commit "$(git rev-parse HEAD)" \
            --subject "$subject" --body ""
        env:
          PR: ${{ github.event.pull_request.html_url }}
          GROUP: ${{ needs.test.outputs.group }}
          NAMES: ${{ needs.test.outputs.names }}
          VERSION: ${{ needs.test.outputs.new-version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # pushes made with this token start no runs, dispatches do
      - name: Push the merged main to the binary cache
        run: gh workflow run cachix.yml --ref main
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
