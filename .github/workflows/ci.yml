# dependabot's pull requests run the same checks in deps.yml
name: ci

on:
  push:
    branches: [main]
  pull_request:

# the jobs run every dependency's code, so they get a read-only token; cache.yml trims the caches
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # `just ci` in two halves side by side, the browser tests being about as long as the rest
  ci:
    if: github.actor != 'dependabot[bot]'
    strategy:
      fail-fast: false
      matrix:
        recipes: ["lint test", "web-e2e"]
    name: ci (${{ matrix.recipes }})
    runs-on: ubuntu-latest
    env:
      SOULFIND_REQUIRED: "1"
      CARGO_INCREMENTAL: "0"
      # a debug build with symbols outgrows the runner's disk
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-nix
      # one cache for both halves, saved by the one that builds everything the other needs
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: ci
          save-if: ${{ github.ref == 'refs/heads/main' && matrix.recipes == 'lint test' }}
          cache-on-failure: true
      - run: nix develop -c just ${{ matrix.recipes }}

  nix:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-nix
      # the package this job builds for main is the one hosts substitute, so it is pushed from here
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: ${{ vars.CACHIX_CACHE_NAME }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: ${{ github.event_name != 'push' }}
      - run: nix develop -c just flake-check

  vm:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # install-nix-action opens /dev/kvm to the build users, and nix then counts kvm among its
      # system features on its own
      - uses: ./.github/actions/setup-nix
      # the package's dependencies, which the nix job pushes for main
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: ${{ vars.CACHIX_CACHE_NAME }}
          skipPush: true
      - run: nix develop -c just vm-test
