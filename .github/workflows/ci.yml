# dependabot's pull requests run the same checks in deps.yml
name: ci

on:
  push:
    branches: [main]
  pull_request:

# the jobs run every dependency's code, so they get a read-only token; cache.yml trims the caches
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    env:
      SOULFIND_REQUIRED: "1"
      CARGO_INCREMENTAL: "0"
      # a debug build with symbols outgrows the runner's disk
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-nix
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - run: nix develop -c just ci

  nix:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-nix
      - run: nix develop -c just flake-check
