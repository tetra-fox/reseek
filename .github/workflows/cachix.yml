name: cachix

# a host whose reseek input does not follow its own nixpkgs substitutes the package from here.
# ci's nix job pushes main's; this covers tags, and deps.yml dispatches it after merging a bump,
# since that push starts no run
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    # 3 to 27 minutes, 50 when none of the package's dependencies were in cachix
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-nix
      # the token is in the runner, not in the nix sandbox the dependencies' build code runs in
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: ${{ vars.CACHIX_CACHE_NAME }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - run: nix build --print-build-logs .#default
