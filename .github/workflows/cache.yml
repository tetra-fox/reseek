# old caches crowd the current ones out of the quota, and only a tag's own runs can read its
# caches. apart from ci because deleting needs `actions: write`; this job runs no repository code
name: cache

on:
  workflow_run:
    workflows: [ci, deps]
    types: [completed]

permissions:
  actions: write

# each run trims every ref, so a queued run replaces an older queued one
concurrency:
  group: ${{ github.workflow }}

jobs:
  trim:
    runs-on: ubuntu-latest
    # a few seconds
    timeout-minutes: 10
    steps:
      - name: Keep each ref's newest nix and cargo cache, delete tags' caches
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        # the setup-nix action saves under `nix-<os>-`, rust-cache under `v0-rust-`
        run: |
          gh cache list --limit 1000 --json id,key,ref,createdAt --jq '
            (.[] | select(.ref | contains("refs/tags/")) | .id),
            (map(select(.ref | contains("refs/tags/") | not)
                 | select(.key | test("^(nix-|v0-rust-)"))
                 | .family = (.key | split("-")[0:2] | join("-")))
              | group_by([.ref, .family])[] | sort_by(.createdAt) | .[:-1][] | .id)' \
            | xargs -r -n1 gh cache delete
