name: release

on:
  push:
    tags: ["v*"]

# the builds run every dependency's code, so only the release job can write
permissions:
  contents: read

jobs:
  # each architecture on a runner of its own, so the binaries run once before they ship
  linux:
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    # 15 to 20 minutes, 30 when one job built both
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-nix
      - run: nix develop -c just release ${{ matrix.arch }}
      - run: nix develop -c just release-check linux-${{ matrix.arch }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-${{ matrix.arch }}
          path: |
            dist/reseek-linux-${{ matrix.arch }}
            dist/reseek-agent-linux-${{ matrix.arch }}

  # no cargo or pnpm cache: only this tag's runs could read it, and main never builds on macos
  macos:
    runs-on: macos-latest
    # 34 to 44 minutes, with nothing cached
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - run: brew install just
      - run: just release-macos
      # runs the arm64 half, the runner's own
      - run: just release-check macos-universal
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos
          path: |
            dist/reseek-macos-universal
            dist/reseek-agent-macos-universal

  # the signing key and the token that attests are only here, where no dependency's code runs
  sign:
    needs: [linux, macos]
    runs-on: ubuntu-latest
    # under a minute
    timeout-minutes: 10
    permissions:
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          merge-multiple: true
      # SHA256SUMS.minisig is checked against reseek.pub with `minisign -Vm SHA256SUMS -p reseek.pub`
      - name: Write and sign the checksums
        env:
          MINISIGN_KEY: ${{ secrets.MINISIGN_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          sudo apt-get update
          sudo apt-get install -y minisign
          sha256sum reseek-* > SHA256SUMS
          printf '%s\n' "$MINISIGN_KEY" > release.key
          trap 'rm -f release.key' EXIT
          printf '%s\n' "$MINISIGN_PASSWORD" | minisign -S -s release.key -m SHA256SUMS
      # checked with `gh attestation verify <file> --repo tetra-fox/reseek`
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: reseek-*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signatures
          path: |
            SHA256SUMS
            SHA256SUMS.minisig

  release:
    needs: sign
    runs-on: ubuntu-latest
    # under a minute
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # the release notes need the tags and the commits between them. nothing here pushes, so the
      # write token stays out of .git/config, where git-cliff, a downloaded binary, could read it
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          merge-multiple: true
      - uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        with:
          config: cliff.toml
          args: --latest --strip all
        env:
          OUTPUT: notes.md
      # the first release has every commit behind it, more than a release body holds;
      # prereleases do not count, as in cliff.toml
      - name: Keep the first release's notes short
        run: |
          git describe --tags --abbrev=0 --exclude '*-*' HEAD^ 2>/dev/null || echo "First release." > notes.md
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          draft: true
          # a tag such as v0.1.0-rc1 is published as a prerelease, which is never marked latest
          prerelease: ${{ contains(github.ref_name, '-') }}
          body_path: notes.md
          files: |
            reseek-*
            SHA256SUMS
            SHA256SUMS.minisig
