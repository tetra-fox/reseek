name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-nix
      - run: nix develop -c just release
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: dist/reseek-linux-*

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: Swatinem/rust-cache@v2
      - run: brew install just
      - run: just release-macos
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: dist/reseek-macos-universal

  release:
    needs: [linux, macos]
    runs-on: ubuntu-latest
    steps:
      # the release notes need the tags and the commits between them
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip all
        env:
          OUTPUT: notes.md
      # the first tag has every commit behind it, more than a release body holds
      - name: Keep the first release's notes short
        run: |
          git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "First release." > notes.md
      # SHA256SUMS.minisig is checked against reseek.pub with `minisign -Vm SHA256SUMS -p reseek.pub`
      - name: Write and sign the checksums
        env:
          MINISIGN_KEY: ${{ secrets.MINISIGN_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          sudo apt-get install -y minisign
          sha256sum reseek-* > SHA256SUMS
          printf '%s\n' "$MINISIGN_KEY" > release.key
          trap 'rm -f release.key' EXIT
          printf '%s\n' "$MINISIGN_PASSWORD" | minisign -S -s release.key -m SHA256SUMS
      - uses: softprops/action-gh-release@v3
        with:
          draft: true
          body_path: notes.md
          files: |
            reseek-*
            SHA256SUMS
            SHA256SUMS.minisig
