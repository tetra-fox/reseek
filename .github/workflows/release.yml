name: release

on:
  push:
    tags: ["v*"]

# the builds run every dependency's code, so only the release job can write
permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-nix
      - run: nix develop -c just release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux
          path: |
            dist/reseek-linux-*
            dist/reseek-agent-linux-*

  # no cargo or pnpm cache: a tag's cache could only be read by that same tag's runs, and main
  # never builds on macos
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - run: brew install just
      - run: just release-macos
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos
          path: |
            dist/reseek-macos-universal
            dist/reseek-agent-macos-universal

  # the signing key is only here, where nothing but the built files and minisign runs
  sign:
    needs: [linux, macos]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          merge-multiple: true
      # SHA256SUMS.minisig is checked against reseek.pub with `minisign -Vm SHA256SUMS -p reseek.pub`
      - name: Write and sign the checksums
        env:
          MINISIGN_KEY: ${{ secrets.MINISIGN_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          sudo apt-get update
          sudo apt-get install -y minisign
          sha256sum reseek-* > SHA256SUMS
          printf '%s\n' "$MINISIGN_KEY" > release.key
          trap 'rm -f release.key' EXIT
          printf '%s\n' "$MINISIGN_PASSWORD" | minisign -S -s release.key -m SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signatures
          path: |
            SHA256SUMS
            SHA256SUMS.minisig

  release:
    needs: sign
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # the release notes need the tags and the commits between them. nothing here pushes, so the
      # write token stays out of .git/config, where git-cliff, a downloaded binary, could read it
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          merge-multiple: true
      - uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        with:
          config: cliff.toml
          args: --latest --strip all
        env:
          OUTPUT: notes.md
      # the first tag has every commit behind it, more than a release body holds
      - name: Keep the first release's notes short
        run: |
          git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "First release." > notes.md
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          draft: true
          # a tag such as v0.1.0-rc1 is published as a prerelease, which is never marked latest
          prerelease: ${{ contains(github.ref_name, '-') }}
          body_path: notes.md
          files: |
            reseek-*
            SHA256SUMS
            SHA256SUMS.minisig
