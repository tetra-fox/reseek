# the image is built from the static binaries of the published release, as `just docker` does
name: docker

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # the binaries go into the image only once SHA256SUMS is signed by reseek.pub and lists
      # each of them with the hash it has
      - name: Gather the build context
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y minisign
          mkdir context
          gh release download "$TAG" --dir context --pattern 'reseek-linux-*' \
            --pattern SHA256SUMS --pattern SHA256SUMS.minisig
          minisign -Vm context/SHA256SUMS -p reseek.pub
          for arch in amd64 arm64; do
            grep -Eq "^[0-9a-f]{64} [ *]reseek-linux-$arch\$" context/SHA256SUMS
          done
          (cd context && sha256sum --check --strict --ignore-missing SHA256SUMS)
          rm context/SHA256SUMS context/SHA256SUMS.minisig
          for arch in amd64 arm64; do
            mv "context/reseek-linux-$arch" "context/reseek-$arch"
            chmod +x "context/reseek-$arch"
          done
          cp docker/entrypoint.sh context/
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          # a prerelease gets only its version; `latest` is added for any other version. no major
          # tag while the major is 0
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: context
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
