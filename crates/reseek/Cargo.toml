[package]
name = "reseek"
description = "A Soulseek client daemon with a web UI"
version.workspace = true
edition.workspace = true
publish.workspace = true
license = "AGPL-3.0-only"

[dependencies]
api-types.workspace = true
cascade.workspace = true
reseek-relay-proto.workspace = true
reseek-shares.workspace = true
reseek-tls.workspace = true
soulseek-client.workspace = true
soulseek-proto.workspace = true

aes-gcm = { version = "0.11", default-features = false, features = ["aes", "alloc"] }
argon2 = { version = "0.6", default-features = false, features = ["alloc", "password-hash"] }
async-trait = "0.1"
axum = { version = "0.8", features = ["multipart", "ws"] }
base64.workspace = true
bytes = "1"
bytesize.workspace = true
chrono.workspace = true
crc32fast = "1"
directories.workspace = true
flate2.workspace = true
form_urlencoded = "1"
futures-util = { workspace = true, features = ["sink"] }
hmac.workspace = true
http-body-util = "0.1"
humantime.workspace = true
hyper = { version = "1", features = ["http1", "http2", "server"] }
hyper-util = { version = "0.1", features = ["server-auto", "server-graceful", "service", "tokio"] }
# asks the router to forward the peer port: UPnP, then NAT-PMP or PCP at the default gateway
igd-next = { version = "0.18", default-features = false, features = ["aio_tokio"] }
crab_nat = { version = "0.8", features = ["tracing"] }
netdev = { version = "0.47", default-features = false, features = ["gateway"] }
# decodes uploaded profile pictures and encodes them as JPEG, in pure Rust
image = { version = "0.25", default-features = false, features = ["bmp", "jpeg", "png", "gif", "webp"] }
mime_guess = "2"
notify.workspace = true
openidconnect = { version = "4", default-features = false }
p12-keystore = "0.4"
percent-encoding = "2"
rand.workspace = true
realfft = "3"
rcgen.workspace = true
regex.workspace = true
reqwest = { workspace = true, features = ["cookies", "json", "multipart", "stream"] }
rpassword = "7"
rusqlite.workspace = true
rustls.workspace = true
serde.workspace = true
serde_html_form = "0.4"
serde_json.workspace = true
serde_path_to_error.workspace = true
serde_plain.workspace = true
sha2.workspace = true
subtle.workspace = true
# decodes every audio format the analyzer reads, streamed
symphonia = { version = "0.6", features = ["all"] }
symphonia-common = "0.6"
sysinfo = { version = "0.40", default-features = false, features = ["disk", "network", "system"] }
thiserror.workspace = true
time = "0.3"
tokio = { workspace = true, features = ["process", "rt-multi-thread", "signal"] }
tokio-rustls.workspace = true
tokio-util = { workspace = true, features = ["io", "rt"] }
toml.workspace = true
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["catch-panic", "cors"] }
tracing.workspace = true
tracing-appender = "0.2"
tracing-subscriber = { workspace = true, features = ["ansi", "env-filter", "registry"] }
url.workspace = true
utoipa.workspace = true
utoipa-axum = "0.3"
utoipa-swagger-ui = { version = "10", features = ["axum", "vendored"] }
uuid.workspace = true

# deletes relative to an opened directory, never through a link, and kills a script's process
# group
[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs", "process"] }

# puts each script in a job object, so killing it ends what it started too
[target.'cfg(windows)'.dependencies]
win32job = "2"

[dev-dependencies]
reseek-shares = { workspace = true, features = ["testing"] }
# make the lossless and lossy audio the analyzer is tested on
flacenc = { version = "0.5", default-features = false }
# builds the LAME source it carries with autotools (`configure`, `make`, a C compiler), for
# the test fixtures only; nothing of it is in the program
mp3lame-encoder = "0.3"
proptest.workspace = true
# turns a generated key into the PKCS#1 form the test identity provider signs with
rsa = "0.9"
tempfile.workspace = true
# reads back the archives the files service writes
zip = { version = "9", default-features = false }
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
