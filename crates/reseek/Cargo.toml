[package]
name = "reseek"
description = "A Soulseek client daemon with a web UI"
version.workspace = true
edition.workspace = true
publish.workspace = true
license = "AGPL-3.0-only"

[features]
default = ["webui"]
# embeds web/build (or a one-line page when it was not built) into the `reseek` binary
webui = ["dep:rust-embed"]

[[bin]]
name = "reseek"
path = "src/bin/reseek.rs"
required-features = ["webui"]

[[bin]]
name = "reseek-headless"
path = "src/bin/reseek-headless.rs"

[dependencies]
api-types.workspace = true
cascade.workspace = true
soulseek-client.workspace = true

aes-gcm = { version = "0.10", default-features = false, features = ["aes", "alloc"] }
argon2 = { version = "0.5", default-features = false, features = ["alloc", "password-hash"] }
async-trait = "0.1"
axum = { version = "0.8", features = ["multipart"] }
base64 = "0.22"
bytes = "1"
bytesize.workspace = true
chrono.workspace = true
crc32fast = "1"
directories = "6"
form_urlencoded = "1"
futures-util.workspace = true
hmac = "0.12"
http-body-util = "0.1"
humantime = "2"
humantime-serde.workspace = true
hyper = { version = "1", features = ["http1", "http2", "server"] }
hyper-util = { version = "0.1", features = ["server-auto", "server-graceful", "service", "tokio"] }
mime_guess = "2"
openidconnect = { version = "4", default-features = false, features = ["reqwest"] }
p12-keystore = "0.4"
percent-encoding = "2"
rand = "0.9"
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "pem"] }
regex = "1"
reqwest.workspace = true
rpassword = "7"
rusqlite = { version = "0.39", features = ["bundled", "trace"] }
rust-embed = { version = "8", features = ["interpolate-folder-path", "mime-guess"], optional = true }
rustls.workspace = true
serde.workspace = true
serde_html_form = "0.2"
serde_json.workspace = true
serde_path_to_error.workspace = true
sha2.workspace = true
subtle = "2"
sysinfo = { version = "0.39", default-features = false, features = ["disk", "network", "system"] }
thiserror.workspace = true
time = "0.3"
tokio = { workspace = true, features = ["rt-multi-thread", "signal"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs", "logging", "tls12"] }
tokio-util.workspace = true
toml.workspace = true
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["catch-panic", "cors"] }
tracing.workspace = true
tracing-appender = "0.2"
tracing-subscriber = { workspace = true, features = ["ansi", "env-filter", "registry"] }
url = "2"
utoipa.workspace = true
utoipa-axum = "0.2"
utoipa-swagger-ui = { version = "9", features = ["axum", "vendored"] }
uuid.workspace = true
webpki-roots.workspace = true

# deletes relative to an opened directory, never through a link
[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs"] }

[dev-dependencies]
api-client.workspace = true
# turns a generated key into the PKCS#1 form the test identity provider signs with
rsa = "0.9"
tempfile.workspace = true
# reads back the archives the files service writes
zip = { version = "6", default-features = false }
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
