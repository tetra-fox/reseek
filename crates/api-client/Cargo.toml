[package]
name = "api-client"
description = "A typed client of the reseek HTTP API and its event stream"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
api-types.workspace = true

base64 = "0.22"
bytes = "1"
eventsource-stream = "0.2"
futures-util = { workspace = true, features = ["sink"] }
percent-encoding = "2"
reqwest = { workspace = true, features = ["cookies", "json", "multipart", "stream"] }
rustls.workspace = true
serde.workspace = true
serde_html_form = "0.2"
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs", "logging", "tls12"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
tracing.workspace = true
url = "2"
uuid.workspace = true
webpki-roots.workspace = true

[lints]
workspace = true
