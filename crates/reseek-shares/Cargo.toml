[package]
name = "reseek-shares"
description = "The share index of reseek and of its relay agent: scanning, watching and the queries peers are answered from"
version.workspace = true
edition.workspace = true
publish.workspace = true
license = "AGPL-3.0-only"

[features]
# in-memory databases for the tests of the crates that use this one
testing = ["dep:tracing-subscriber"]

[dependencies]
api-types.workspace = true
cascade.workspace = true
soulseek-client.workspace = true
soulseek-proto.workspace = true

chrono.workspace = true
lofty.workspace = true
notify.workspace = true
rand.workspace = true
regex.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
sha1.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, optional = true }
url.workspace = true
uuid.workspace = true
walkdir.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
tracing-subscriber.workspace = true

[lints]
workspace = true
