[package]
name = "reseek-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
api-types = { path = "../crates/api-types" }
cascade = { path = "../crates/cascade" }
flate2 = "1"
libfuzzer-sys = "0.4"
reseek = { path = "../crates/reseek", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
soulseek-proto = { path = "../crates/soulseek-proto" }
toml_edit = "0.25"

# its own workspace: cargo-fuzz builds with nightly and the main workspace stays on stable
[workspace]
members = ["."]

[[bin]]
name = "frame"
path = "fuzz_targets/frame.rs"
test = false
doc = false
bench = false

[[bin]]
name = "server_message"
path = "fuzz_targets/server_message.rs"
test = false
doc = false
bench = false

[[bin]]
name = "peer_message"
path = "fuzz_targets/peer_message.rs"
test = false
doc = false
bench = false

